<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Radar de Leads</title>
  <style>
    :root { --bg: #ffffff; --surface: #fff; --ink: #15201c; --muted: #5f6d68; --line: #d8e0dc; --accent: #0f7a5c; --accent-ink: #fff; --danger: #b91c1c; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; width: min(360px, 100%); display: grid; gap: 14px; }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 0; color: var(--muted); font-size: 14px; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
    input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 11px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #erro { color: var(--danger); min-height: 1.4em; }
  </style>
</head>
<body>
  <form id="f">
    <h1>Radar de Leads</h1>
    <p>Digite a senha para entrar.</p>
    <label>Senha <input id="senha" type="password" autocomplete="current-password" required autofocus></label>
    <button type="submit">Entrar</button>
    <p id="erro" role="alert"></p>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erro = document.getElementById("erro"); erro.textContent = "";
      try {
        const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ senha: document.getElementById("senha").value }) });
        if (r.ok) { location.href = "/"; return; }
        erro.textContent = (await r.json().catch(() => ({}))).erro || "Não foi possível entrar.";
      } catch { erro.textContent = "Servidor fora do ar. Tente de novo."; }
    });
  </script>
</body>
</html>
